name: release
# Publishes the built Projects UI as release assets. agentic-os pins one of these (version + sha256) and
# fetches it at wheel-build time, so the UI source lives only in this repo and nothing is copied by hand.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck && npm test
      # Two variants: the API base is baked in at build time, so each serving layout needs its own build.
      #   root     -> UI and API on the origin root        (agentic-os-projects, the default)
      #   projects -> UI and API under /projects           (the agentic-os-stack reverse-proxy layout)
      - name: Build bundles
        run: |
          set -euo pipefail
          mkdir -p out
          VITE_PROJECTS_API=/ npm run build -- --base=/
          tar -C dist -czf out/projects-ui-root.tgz .
          VITE_PROJECTS_API=/projects npm run build -- --base=/projects/
          tar -C dist -czf out/projects-ui-projects.tgz .
          (cd out && sha256sum *.tgz > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes "Built Projects UI bundles (root and /projects/ base). Verify with SHA256SUMS."
