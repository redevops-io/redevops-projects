name: tests
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/ui-tests.xml"
      - name: Report the run to the QA portfolio dashboard
        # main only (the dashboard shows the state of main); failures are reported too; a dashboard outage never fails the build
        if: ${{ always() && github.event_name == 'push' }}
        uses: redevops-io/agentic-os/.github/actions/report-qa@v0.4.9
        with:
          junit: ${{ runner.temp }}/ui-tests.xml
          project: projects-ui
          suite: unit
          platform: jsdom
          url: ${{ vars.QA_DASHBOARD_URL }}
          token: ${{ secrets.QA_DASHBOARD_TOKEN }}
      - run: npm run build
